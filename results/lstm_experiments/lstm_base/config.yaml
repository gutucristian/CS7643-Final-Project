data:
  csv_path: SPY_with_labels_triple_barrier.csv
  feature_cols:
    [
      Open, High, Low, Close, Volume, return_1d, log_return_1d,
      close_sma_ratio_5, close_sma_ratio_10, close_sma_ratio_20, close_sma_ratio_50,
      rsi_14, macd, macd_signal, macd_hist, bbp_20, momentum_5, momentum_10, momentum_20,
      volatility_5, volatility_10, volatility_20, volume_ratio_5, volume_ratio_20
    ]
  window_size: 30
  train_frac: 0.7
  val_frac: 0.15
  price_col: Close
  label_col: label
  return_horizon: 10


model:
  hidden_size: 64
  num_layers: 2
  dropout: 0.2
  pooling: mean
  head_hidden_size: 64
  num_classes: 3

training:
  batch_size: 64
  epochs: 30
  learning_rate: 0.001
  weight_decay: 0.0001
  grad_clip: 1.0
  loss: cross_entropy
  focal_gamma: 2.0
  device: auto


labeling:
  upper_barrier: 0.03
  lower_barrier: -0.03
  max_holding_period: 10

backtest:
  initial_capital: 10000


checkpoint:
  dir: checkpoints


